name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1f69ff&color_dots=#ebedf0,#c6d7ff,#8fb1ff,#5a8bff,#1f69ff
            dist/snake-dark.svg?palette=github-dark&color_snake=#c46bf7&color_dots=#161b22,#1a2a5c,#1f3f99,#2a5ad6,#5a8bff

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
