<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Antonio Orionus</title>
  <desc id="d">The Orion constellation drawn in stars on a night-sky background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c16"/>
      <stop offset="0.6" stop-color="#11122a"/>
      <stop offset="1" stop-color="#1a1035"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.8" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#1f69ff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#c46bf7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c46bf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#9dbcff"/>
      <stop offset="1" stop-color="#d9a6ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#9dbcff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1f69ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red">
      <stop offset="0" stop-color="#fff2e0" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ff9a5c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .bg-star { fill: #fff; animation: twinkle 4s ease-in-out infinite; }
    .bg-star:nth-of-type(3n)   { animation-duration: 5.5s; animation-delay: -1.2s; }
    .bg-star:nth-of-type(3n+1) { animation-duration: 3.2s; animation-delay: -2.4s; }
    .bg-star:nth-of-type(4n)   { animation-duration: 6.8s; animation-delay: -0.6s; }
    .line { stroke: #9dbcff; stroke-opacity: 0.45; stroke-width: 1.4; fill: none;
            stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2.4s ease-out forwards; }
    .line.l2 { animation-delay: 0.3s; } .line.l3 { animation-delay: 0.6s; }
    .line.l4 { animation-delay: 0.9s; } .line.l5 { animation-delay: 1.2s; }
    .halo { animation: pulse 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .halo.h2 { animation-delay: -0.9s; } .halo.h3 { animation-delay: -1.8s; } .halo.h4 { animation-delay: -2.7s; }
    .fade { opacity: 0; animation: fade-up 1s ease-out forwards; }
    .shoot { stroke: url(#name); stroke-width: 1.6; stroke-linecap: round; opacity: 0;
             stroke-dasharray: 90 600; animation: shoot 9s ease-in 3s infinite; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes twinkle { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.15; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes shoot { 0% { opacity: 0; stroke-dashoffset: 0; } 2% { opacity: 1; } 10% { opacity: 0; stroke-dashoffset: -600; } 100% { opacity: 0; stroke-dashoffset: -600; } }
    @media (prefers-reduced-motion: reduce) {
      .bg-star, .halo, .shoot { animation: none; }
      .line { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#sky)"/>
    <rect width="1200" height="320" fill="url(#nebula)"/>

    <!-- background stars -->
    <g>
      <circle class="bg-star" cx="42" cy="28" r="0.9"/>
      <circle class="bg-star" cx="118" cy="292" r="1.1"/>
      <circle class="bg-star" cx="176" cy="62" r="0.7"/>
      <circle class="bg-star" cx="240" cy="270" r="0.9"/>
      <circle class="bg-star" cx="310" cy="24" r="1.2"/>
      <circle class="bg-star" cx="388" cy="300" r="0.8"/>
      <circle class="bg-star" cx="452" cy="44" r="0.9"/>
      <circle class="bg-star" cx="530" cy="282" r="1.1"/>
      <circle class="bg-star" cx="584" cy="96" r="0.7"/>
      <circle class="bg-star" cx="640" cy="22" r="1"/>
      <circle class="bg-star" cx="676" cy="250" r="0.8"/>
      <circle class="bg-star" cx="724" cy="140" r="1.1"/>
      <circle class="bg-star" cx="760" cy="296" r="0.9"/>
      <circle class="bg-star" cx="792" cy="58" r="0.8"/>
      <circle class="bg-star" cx="836" cy="214" r="1"/>
      <circle class="bg-star" cx="868" cy="30" r="0.7"/>
      <circle class="bg-star" cx="884" cy="300" r="1.2"/>
      <circle class="bg-star" cx="1004" cy="290" r="0.8"/>
      <circle class="bg-star" cx="1090" cy="40" r="1"/>
      <circle class="bg-star" cx="1124" cy="158" r="0.8"/>
      <circle class="bg-star" cx="1150" cy="280" r="1.1"/>
      <circle class="bg-star" cx="1172" cy="96" r="0.7"/>
      <circle class="bg-star" cx="1112" cy="214" r="0.9"/>
      <circle class="bg-star" cx="1046" cy="18" r="0.8"/>
      <circle class="bg-star" cx="70" cy="160" r="0.7"/>
      <circle class="bg-star" cx="20" cy="240" r="1"/>
    </g>

    <!-- occasional shooting star -->
    <path class="shoot" d="M 300 30 L 640 140"/>

    <!-- Orion -->
    <g>
      <path class="line"    d="M 962 58 L 902 96"/>
      <path class="line"    d="M 962 58 L 1034 104"/>
      <path class="line l2" d="M 902 96 L 950 186"/>
      <path class="line l2" d="M 1034 104 L 1002 164"/>
      <path class="line l3" d="M 950 186 L 976 175 L 1002 164"/>
      <path class="line l4" d="M 950 186 L 916 262"/>
      <path class="line l5" d="M 1002 164 L 1064 252"/>

      <!-- Betelgeuse -->
      <circle class="halo"    cx="902"  cy="96"  r="22" fill="url(#glow-red)"/>
      <circle cx="902"  cy="96"  r="3.6" fill="#ffd2b0"/>
      <!-- Rigel -->
      <circle class="halo h2" cx="1064" cy="252" r="24" fill="url(#glow)"/>
      <circle cx="1064" cy="252" r="3.8" fill="#eaf1ff"/>
      <!-- Bellatrix -->
      <circle class="halo h3" cx="1034" cy="104" r="15" fill="url(#glow)"/>
      <circle cx="1034" cy="104" r="2.8" fill="#eaf1ff"/>
      <!-- Saiph -->
      <circle class="halo h4" cx="916"  cy="262" r="14" fill="url(#glow)"/>
      <circle cx="916"  cy="262" r="2.6" fill="#eaf1ff"/>
      <!-- Meissa -->
      <circle cx="962"  cy="58"  r="2.2" fill="#eaf1ff"/>
      <!-- Belt: Alnitak, Alnilam, Mintaka -->
      <circle class="halo h2" cx="976" cy="175" r="16" fill="url(#glow)"/>
      <circle cx="950"  cy="186" r="2.8" fill="#eaf1ff"/>
      <circle cx="976"  cy="175" r="3"   fill="#ffffff"/>
      <circle cx="1002" cy="164" r="2.7" fill="#eaf1ff"/>
    </g>

    <!-- text -->
    <g class="fade">
      <text class="sans" x="72" y="182" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Antonio Orionus</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
